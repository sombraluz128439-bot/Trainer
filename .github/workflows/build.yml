name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Localizar ferramentas Android (já vêm instaladas no ubuntu-latest)
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          BT="$(ls -1 "$SDK/build-tools" 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$BT" ]; then
            echo "Nenhum build-tools instalado; tentando instalar o 34.0.0"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
            BT="34.0.0"
          fi
          echo "BUILD_TOOLS=$SDK/build-tools/$BT" >> "$GITHUB_ENV"
          echo "Usando build-tools $BT"
          test -x "$SDK/build-tools/$BT/zipalign" && test -x "$SDK/build-tools/$BT/apksigner"
      - name: Verificar JavaScript
        shell: bash
        run: |
          node --check www/calls.js
          node --check www/pontos.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('www/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', html, re.I | re.S)
          with tempfile.TemporaryDirectory() as tmp:
              for i, block in enumerate(blocks):
                  p = Path(tmp) / f'inline-{i}.js'
                  p.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(p)], check=True)
          print(f'{len(blocks)} scripts inline verificados.')
          PY
      - name: Baixar fontes (precisa de internet; roda aqui no GitHub)
        shell: bash
        run: |
          python3 scripts/fetch_fonts.py --strict
          echo "Arquivos de fonte baixados: $(find www/fonts/files -type f | wc -l)"
          test "$(find www/fonts/files -type f | wc -l)" -gt 4
      - name: Preparar APK
        run: python3 scripts/patch_apk.py --base reference/base-app-debug.apk --output build/unsigned.apk
      - name: Alinhar APK
        shell: bash
        run: |
          BUILD_TOOLS="$BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
      - name: Preparar chave de assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE6
