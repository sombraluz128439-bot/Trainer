name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Localizar ferramentas Android
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          BT="$(ls -1 "$SDK/build-tools" 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$BT" ]; then
            echo "Nenhum build-tools instalado; tentando instalar o 34.0.0"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
            BT="34.0.0"
          fi
          echo "BUILD_TOOLS=$SDK/build-tools/$BT" >> "$GITHUB_ENV"
          echo "Usando build-tools $BT"
          test -x "$SDK/build-tools/$BT/zipalign" && test -x "$SDK/build-tools/$BT/apksigner"
      - name: Verificar JavaScript
        shell: bash
        run: |
          echo "Arquivos no repositório:"
          ls -la . www 2>&1 | head -50
          found=0
          while IFS= read -r f; do
            echo "Verificando $f"
            node --check "$f"
            found=$((found+1))
          done < <(find www -name '*.js' -not -path 'www/fonts/*' 2>/dev/null)
          echo "$found arquivos .js verificados."
          if [ -f www/index.html ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('www/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', html, re.I | re.S)
          with tempfile.TemporaryDirectory() as tmp:
              for i, block in enumerate(blocks):
                  p = Path(tmp) / f'inline-{i}.js'
                  p.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(p)], check=True)
          print(f'{len(blocks)} scripts inline verificados.')
          PY
          else
            echo "AVISO: www/index.html não encontrado"
          fi
      - name: Baixar fontes
        shell: bash
        run: |
          python3 scripts/fetch_fonts.py --strict
          echo "Arquivos de fonte baixados: $(find www/fonts/files -type f | wc -l)"
          test "$(find www/fonts/files -type f | wc -l)" -gt 4
      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p build
          python3 scripts/patch_apk.py --base reference/base-app-debug.apk --output build/unsigned.apk
      - name: Alinhar APK
        shell: bash
        run: |
          "$BUILD_TOOLS/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
      - name: Preparar chave de assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEY_PASSWORD:-$KS_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "Secrets de assinatura ausentes; usando chave debug."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
      - name: Assinar e verificar APK
        shell: bash
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out build/app-debug.apk build/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose build/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: treinadores-offline-apk
          path: build/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: APK pronto — Treinadores Falantes Offline
          overwrite_files: true
          fail_on_unmatched_files: true
          files: build/app-debug.apk
